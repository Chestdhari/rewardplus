spring.application.name=rewardplus
server.port=${PORT:8080}

# Database Configuration (supports MySQL, PostgreSQL, or Render/Railway/Supabase/TiDB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rewardplus2}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate / JPA (automatically creates/updates tables on startup)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:RewardPlusSecretKeyForJwtAuthentication2026RewardPlusSecretKey}
jwt.expiration=${JWT_EXPIRATION:86400000}
